[project]
name = "triage-guard-board"
version = "0.1.0"
description = "The nurse-facing queue board for Triage Guard (SPECIFICATION.md § World plane) — one card per live case, columns by clinical_status, sorted by the persisted order_key. A read-only view: every write still goes through the graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.2.3",
    # The triage-guard package (triage-app/app/), for app.runner, app.views and
    # app.observability — the board calls into app/, never the other way
    # around. Path dependency: both live in the same repo checkout.
    "triage-guard",
]

[tool.uv.sources]
triage-guard = { path = "../triage-app", editable = true }

# A uv dependency group, not an extra: uv installs it on `uv sync` by default,
# so `uv run tests` works with no flags. Matches crm-stub/ and intake-channel/.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
board = "board.api:run"
seed-board = "board.seed_demo:main"
tests = "pytest:console_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["board"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
