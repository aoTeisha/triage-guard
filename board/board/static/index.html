<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Triage Guard — board</title>
  <style>
    :root {
      --bg: #12141a; --panel: #1b1e26; --panel-2: #222631; --line: #2c313d;
      --text: #e6e8ee; --muted: #8d94a5; --emergent: #e5484d; --ok: #30a46c;
      --warn: #f5a524; --chip: #2b303c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 14px/1.45 system-ui, sans-serif; }
    header { padding: 0.9rem 1.2rem; border-bottom: 1px solid var(--line);
             display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
    header h1 { font-size: 1rem; margin: 0; letter-spacing: 0.02em; }
    header .sub { color: var(--muted); font-size: 0.8rem; }
    #counters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-left: auto; }
    .counter { background: var(--panel); border: 1px solid var(--line);
               border-radius: 8px; padding: 0.35rem 0.7rem; min-width: 5.5rem; }
    .counter .n { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .counter .l { color: var(--muted); font-size: 0.7rem; text-transform: uppercase;
                  letter-spacing: 0.06em; }
    .counter.alert .n { color: var(--emergent); }

    .bell { position: relative; background: none; border: 1px solid var(--line);
            border-radius: 8px; width: 2.2rem; height: 2.2rem; cursor: pointer;
            color: var(--text); display: flex; align-items: center; justify-content: center; }
    .bell:hover { border-color: #47506a; }
    .bell svg { width: 1.15rem; height: 1.15rem; }
    .bell .badge { position: absolute; top: -0.35rem; right: -0.35rem; background: var(--emergent);
                   color: #fff; border-radius: 999px; min-width: 1.1rem; height: 1.1rem;
                   font-size: 0.65rem; font-weight: 700; line-height: 1.1rem; text-align: center;
                   padding: 0 0.25rem; }
    .bell .badge[hidden] { display: none; }

    #notif-panel { position: fixed; top: 0; left: 0; width: min(24rem, 92vw); height: 100%;
                   background: var(--panel); border-right: 1px solid var(--line);
                   padding: 1rem 1.1rem; overflow-y: auto; transform: translateX(-101%);
                   transition: transform 0.15s ease-out; z-index: 10; }
    #notif-panel.open { transform: none; }
    #notif-panel h2 { font-size: 0.95rem; margin: 0 0 0.6rem; }
    #notif-panel .close { float: right; cursor: pointer; color: var(--muted);
                           background: none; border: none; font-size: 1.1rem; }
    .notif-item { background: var(--panel-2); border: 1px solid var(--line);
                  border-left: 3px solid var(--warn); border-radius: 8px;
                  padding: 0.5rem 0.6rem; margin-bottom: 0.5rem; cursor: pointer; }
    .notif-item:hover { border-color: #47506a; }
    .notif-item.blk { border-left-color: var(--emergent); }
    .notif-item .arrow { color: var(--warn); font-weight: 600; font-size: 0.78rem; }
    .notif-item.blk .arrow { color: var(--emergent); }
    .notif-item .complaint { font-size: 0.82rem; margin-top: 0.15rem; }
    .notif-item .at { color: var(--muted); font-size: 0.7rem; margin-top: 0.2rem;
                      font-variant-numeric: tabular-nums; }

    main { display: flex; gap: 0.75rem; padding: 1rem 1.2rem; align-items: flex-start;
           overflow-x: auto; }
    .column { flex: 1 0 15rem; background: var(--panel); border: 1px solid var(--line);
              border-radius: 10px; padding: 0.6rem; min-height: 8rem; }
    .column h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em;
                 color: var(--muted); margin: 0 0 0.6rem; display: flex;
                 justify-content: space-between; }
    .column.empty-col { opacity: 0.55; }
    .column .todo { font-size: 0.72rem; color: var(--muted); font-style: italic; }

    .card { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--line);
            border-radius: 8px; padding: 0.5rem 0.6rem; margin-bottom: 0.5rem;
            display: grid; grid-template-columns: 2.2rem 1fr; gap: 0.1rem 0.6rem;
            cursor: pointer; }
    .card:hover { border-color: #47506a; }
    .card.emergent { border-left-color: var(--emergent); }
    .card.selected { outline: 1px solid #5b6ee1; }
    .card.just-arrived { animation: arrived 6s ease-out; }
    @keyframes arrived {
      0%, 60% { background: #1e3a2b; box-shadow: 0 0 0 1px var(--ok); }
      100% { background: var(--panel-2); box-shadow: none; }
    }
    .pos { grid-row: span 3; font-size: 1.5rem; font-variant-numeric: tabular-nums;
           color: var(--muted); align-self: center; text-align: center; }
    .who { font-weight: 600; }
    .who small { color: var(--muted); font-weight: 400; }
    .meta { color: var(--muted); font-size: 0.78rem; }
    .meta .wait.red { color: var(--emergent); }
    .chips { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.15rem; }
    .chip { font-size: 0.68rem; background: var(--chip); border-radius: 4px;
            padding: 0.05rem 0.35rem; color: var(--muted); }
    .chip.acuity { color: var(--text); }
    .chip.acuity.emergent { background: #46171a; color: #ff9ea1; }
    .chip.gate { background: #4a3708; color: #ffd479; }
    .chip.degraded { background: #3a2a10; color: var(--warn); }

    #drawer { margin: 0 1.2rem 1rem; }
    #drawer summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; }
    #drawer .cards { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }

    #panel { position: fixed; top: 0; right: 0; width: min(30rem, 92vw); height: 100%;
             background: var(--panel); border-left: 1px solid var(--line);
             padding: 1rem 1.1rem; overflow-y: auto; transform: translateX(101%);
             transition: transform 0.15s ease-out; }
    #panel.open { transform: none; }
    #panel h2 { font-size: 0.95rem; margin: 0 0 0.2rem; }
    #panel .close { float: right; cursor: pointer; color: var(--muted);
                    background: none; border: none; font-size: 1.1rem; }
    .kv { display: grid; grid-template-columns: 9rem 1fr; gap: 0.1rem 0.6rem;
          font-size: 0.82rem; margin: 0.6rem 0; }
    .kv .k { color: var(--muted); }
    .kv .v { font-variant-numeric: tabular-nums; }
    .section { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: 0.7rem; }
    .section h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em;
                  color: var(--muted); margin: 0 0 0.4rem; }
    .trail { font-size: 0.78rem; }
    .trail tr td { padding: 0.2rem 0.4rem 0.2rem 0; border-top: 1px solid var(--line);
                   vertical-align: top; }
    .trail .at { color: var(--muted); white-space: nowrap; padding-right: 0.6rem;
                 font-variant-numeric: tabular-nums; }
    .moves .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    .moves button { border-radius: 6px; padding: 0.4rem 0.8rem; font: inherit;
                     font-weight: 600; border: 1px solid transparent; cursor: pointer; }
    .moves button[disabled] { background: var(--panel-2); color: var(--muted);
                               border-color: var(--line); font-weight: 400;
                               cursor: not-allowed; opacity: 0.6; }
    .moves .move-btn:not([disabled]) { background: var(--ok); color: #05170e; border-color: #4cc789; }
    .moves .move-btn:hover:not([disabled]) { background: #3fc086; }
    .moves .release-btn:not([disabled]) { background: var(--warn); color: #1a1400; border-color: #ffbd47; }
    .moves .release-btn:hover:not([disabled]) { background: #ffb84d; }
    .moves select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
                    border-radius: 6px; padding: 0.4rem 0.5rem; font: inherit; }
    .moves .msg { margin-top: 0.5rem; }
    .msg { font-size: 0.78rem; }
    .msg.err { color: var(--emergent); }
    .msg.ok { color: var(--ok); }

    .refile { border-top: none; margin-top: 1.2rem; background: #2a2308; border: 1px solid #5c4a10;
              border-left: 3px solid var(--warn); border-radius: 8px; padding: 0.8rem 0.9rem; }
    .refile h3 { color: var(--warn); font-size: 0.8rem; }
    .refile h3::before { content: "⏱ "; }
    .refile label { display: block; font-size: 0.75rem; color: var(--muted); margin: 0.5rem 0 0.15rem; }
    .refile input, .refile select { width: 100%; background: var(--panel-2); color: var(--text);
                                     border: 1px solid var(--line); border-radius: 6px;
                                     padding: 0.3rem 0.5rem; font: inherit; }
    .refile .vitals { display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.5rem; }
    .refile button { margin-top: 0.7rem; background: var(--warn); color: #1a1400; border: 1px solid #ffbd47;
                     padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .refile button:hover:not([disabled]) { background: #ffb84d; }
    .refile button[disabled] { opacity: 0.6; cursor: not-allowed; }
    .refile .msg { margin-top: 0.5rem; }

    .gate-resolve { border-top: none; margin-top: 1.2rem; background: #2a1f08; border: 1px solid #5c4a10;
            border-left: 3px solid var(--warn); border-radius: 8px; padding: 0.8rem 0.9rem; }
    .gate-resolve.severe { background: #2c1414; border-color: #5c1f1f; border-left-color: var(--emergent); }
    .gate-resolve h3 { color: var(--warn); font-size: 0.8rem; margin: 0 0 0.4rem; }
    .gate-resolve h3::before { content: "⚠ "; }
    .gate-resolve.severe h3 { color: var(--emergent); }
    .gate-resolve .heading { font-size: 0.82rem; line-height: 1.4; margin-bottom: 0.7rem; }
    .gate-resolve label { display: block; font-size: 0.75rem; color: var(--muted); margin: 0 0 0.2rem; }
    .gate-resolve select { width: 100%; background: var(--panel-2); color: var(--text);
                   border: 1px solid var(--line); border-radius: 6px;
                   padding: 0.35rem 0.5rem; font: inherit; margin-bottom: 0.7rem; }
    .gate-resolve .controls { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .gate-resolve button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
                   border-radius: 6px; padding: 0.35rem 0.7rem; font: inherit; font-size: 0.82rem;
                   font-weight: 600; cursor: pointer; }
    .gate-resolve button:hover:not([disabled]) { border-color: var(--warn); background: #332708; }
    .gate-resolve.severe button:hover:not([disabled]) { border-color: var(--emergent); background: #3a1a1a; }
    .gate-resolve button[disabled] { opacity: 0.5; cursor: not-allowed; }
    .gate-resolve .msg { margin-top: 0.6rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Triage Guard — board</h1>
      <div class="sub">
        Live queue. A patient's place is set when they are triaged — the board only
        shows it, and never changes a level or a place.
      </div>
    </div>
    <div id="counters"></div>
    <button class="bell" id="notif-bell" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
      <span class="badge" id="notif-badge" hidden>0</span>
    </button>
  </header>

  <aside id="notif-panel" hidden>
    <button class="close" id="notif-panel-close" aria-label="Close">✕</button>
    <h2>Notifications</h2>
    <div id="notif-list"></div>
  </aside>

  <main id="columns"></main>

  <details id="drawer">
    <summary>Left the board today</summary>
    <div class="cards" id="released"></div>
  </details>

  <aside id="panel" hidden>
    <button class="close" id="panel-close" aria-label="Close">✕</button>
    <div id="panel-body"></div>
  </aside>

  <script src="/static/board.js"></script>
</body>
</html>
