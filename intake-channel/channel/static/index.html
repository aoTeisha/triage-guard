<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Triage Guard — intake-channel</title>
  <style>
    :root {
      --color-bg: #f1f5f9;
      --color-surface: #ffffff;
      --color-border: #dde3ea;
      --color-text: #0f172a;
      --color-text-muted: #64748b;
      --color-primary: #0e7490;
      --color-primary-hover: #0c6178;
      --color-primary-foreground: #ffffff;
      --color-success-bg: #e6f4ea;
      --color-success-fg: #1e7e34;
      --color-warn-bg: #fff8e1;
      --color-warn-fg: #8a6d00;
      --color-warn-border: #f0c36d;
      --color-danger-bg: #fff3e0;
      --color-danger-fg: #a15c00;
      --radius: 10px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 1px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
    }

    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 0.35rem;
    }

    .intro {
      color: var(--color-text-muted);
      font-size: 0.9rem;
      margin: 0 0 2rem;
    }

    .intro code {
      background: var(--color-border);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      font-size: 0.85em;
    }

    fieldset {
      margin: 0 0 1.25rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem 1.25rem;
      background: var(--color-surface);
      box-shadow: var(--shadow-sm);
    }

    legend {
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-text-muted);
      padding: 0 0.4rem;
    }

    label { display: block; margin: 0.5rem 0; font-size: 0.95rem; }

    #patient-id {
      padding: 0.55rem 0.7rem;
      width: 12rem;
      max-width: 100%;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 0.95rem;
      background: var(--color-surface);
      color: var(--color-text);
    }

    #patient-id:focus-visible,
    input[type="radio"]:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    button {
      padding: 0.55rem 1.1rem;
      cursor: pointer;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 0.9rem;
      font-weight: 500;
      transition: background-color 150ms ease, border-color 150ms ease, opacity 150ms ease;
    }

    button:hover { background: var(--color-bg); }

    #lookup-btn { margin-left: 0.6rem; }

    #submit-btn {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-primary-foreground);
      padding: 0.65rem 1.4rem;
      font-weight: 600;
    }

    #submit-btn:hover:not(:disabled) { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }

    #submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #lookup-result, #submit-result { margin-top: 0.75rem; }

    #lookup-result:not(:empty) {
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      font-size: 0.88rem;
    }

    .status-found { background: var(--color-success-bg); color: var(--color-success-fg); }
    .status-not_found { background: var(--color-warn-bg); color: var(--color-warn-fg); }
    .status-db_error { background: var(--color-danger-bg); color: var(--color-danger-fg); }

    pre { background: #f5f5f5; padding: 0.6rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }

    #missing-fields-note {
      font-size: 0.85rem;
      color: var(--color-warn-fg);
      background: var(--color-warn-bg);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      margin-top: 0.75rem;
    }

    .summary {
      display: grid;
      grid-template-columns: 10rem 1fr;
      gap: 0.4rem 0.6rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 1rem 1.1rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      font-size: 0.9rem;
    }

    .summary > div { display: contents; }
    .summary .k { color: var(--color-text-muted); }
    .summary .v { font-variant-numeric: tabular-nums; font-weight: 500; }

    .gate {
      margin-top: 0.9rem;
      padding: 1rem 1.1rem;
      border: 1px solid var(--color-warn-border);
      border-left: 4px solid var(--color-warn-border);
      background: var(--color-warn-bg);
      border-radius: var(--radius);
    }

    .gate strong { font-size: 0.95rem; }
    .gate p { margin: 0.5rem 0 0.7rem; font-size: 0.9rem; }
    .gate select { padding: 0.3rem 0.4rem; margin-left: 0.4rem; border-radius: 6px; border: 1px solid var(--color-border); }
    .gate .options { margin-top: 0.7rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .gate .options button { background: var(--color-surface); }
    .gate .options button:hover { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-primary-foreground); }

    .trail {
      margin-top: 0.9rem;
      font-size: 0.82rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.6rem 0.9rem;
      box-shadow: var(--shadow-sm);
    }

    .trail summary { cursor: pointer; font-weight: 500; color: var(--color-text-muted); }
    .trail table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
    .trail td { padding: 0.3rem 0.4rem; border-top: 1px solid var(--color-border); vertical-align: top; }
    .trail .arrow { white-space: nowrap; color: var(--color-warn-fg); font-family: ui-monospace, monospace; }
    .trail .action { white-space: nowrap; color: var(--color-text); }

    @media (max-width: 400px) {
      #patient-id { width: 100%; margin-bottom: 0.5rem; }
      #lookup-btn { margin-left: 0; }
    }
  </style>
</head>
<body>
  <h1>intake-channel</h1>
  <p class="intro">
    Nurse-facing demo intake — stands in for the real webform. Submissions run
    through the real LangGraph control plane; see <code>docs/SPECIFICATION.md</code>
    for the intake outcomes and the acuity gate this exercises.
  </p>

  <fieldset>
    <legend>1. Patient</legend>
    <label for="patient-id">Patient ID</label>
    <input type="text" id="patient-id" placeholder="P-1005" />
    <button id="lookup-btn">Lookup</button>
    <div id="lookup-result" role="status" aria-live="polite"></div>
  </fieldset>

  <fieldset>
    <legend>2. Submission type</legend>
    <label><input type="radio" name="submission_type" value="clean" checked /> Clean submission</label>
    <label><input type="radio" name="submission_type" value="missing" /> Missing fields</label>
    <label><input type="radio" name="submission_type" value="failed" /> Failed submission</label>
    <label><input type="radio" name="submission_type" value="gap" /> Acuity discrepancy (pauses for charge nurse)</label>
    <label><input type="radio" name="submission_type" value="injection" /> Injection attempt</label>
  </fieldset>

  <button id="submit-btn" disabled>Submit</button>

  <div id="submit-result" role="status" aria-live="polite"></div>

  <script src="/static/channel.js"></script>
</body>
</html>
