<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Triage Guard — intake-channel</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 620px; margin: 3rem auto; color: #1a1a1a; }
    fieldset { margin-bottom: 1.25rem; border: 1px solid #ddd; border-radius: 6px; padding: 1rem; }
    legend { font-weight: 600; padding: 0 0.4rem; }
    label { display: block; margin: 0.4rem 0; }
    input[type="text"] { padding: 0.4rem; width: 12rem; }
    button { padding: 0.4rem 0.9rem; cursor: pointer; }
    #lookup-result, #submit-result { margin-top: 0.6rem; padding: 0.6rem; border-radius: 6px; font-size: 0.9rem; }
    .status-found { background: #e6f4ea; color: #1e7e34; }
    .status-not_found { background: #fff8e1; color: #8a6d00; }
    .status-db_error { background: #fff3e0; color: #a15c00; }
    pre { background: #f5f5f5; padding: 0.6rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
    #missing-fields-note { font-size: 0.85rem; color: #555; margin-top: 0.4rem; }
    .summary { display: grid; grid-template-columns: 10rem 1fr; gap: 0.15rem 0.6rem;
               background: #f7f7f8; padding: 0.7rem; border-radius: 6px; }
    .summary > div { display: contents; }
    .summary .k { color: #666; }
    .summary .v { font-variant-numeric: tabular-nums; }
    .gate { margin-top: 0.8rem; padding: 0.8rem; border: 1px solid #f0c36d;
            background: #fffbf0; border-radius: 6px; }
    .gate p { margin: 0.4rem 0 0.6rem; }
    .gate select { padding: 0.25rem; margin-left: 0.4rem; }
    .gate .options { margin-top: 0.6rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .trail { margin-top: 0.8rem; font-size: 0.82rem; }
    .trail table { border-collapse: collapse; width: 100%; margin-top: 0.4rem; }
    .trail td { padding: 0.2rem 0.4rem; border-top: 1px solid #eee; vertical-align: top; }
    .trail .arrow { white-space: nowrap; color: #8a6d00; font-family: ui-monospace, monospace; }
    .trail .action { white-space: nowrap; color: #444; }
  </style>
</head>
<body>
  <h1>intake-channel</h1>
  <p style="color:#555; font-size:0.9rem;">
    Nurse-facing demo intake — stands in for the real webform. Submissions run
    through the real LangGraph control plane; see <code>docs/SPECIFICATION.md</code>
    for the intake outcomes and the acuity gate this exercises.
  </p>

  <fieldset>
    <legend>1. Patient</legend>
    <label for="patient-id">Patient ID</label>
    <input type="text" id="patient-id" placeholder="P-1005" />
    <button id="lookup-btn">Lookup</button>
    <div id="lookup-result"></div>
  </fieldset>

  <fieldset>
    <legend>2. Submission type</legend>
    <label><input type="radio" name="submission_type" value="clean" checked /> Clean submission</label>
    <label><input type="radio" name="submission_type" value="missing" /> Missing fields</label>
    <label><input type="radio" name="submission_type" value="failed" /> Failed submission</label>
    <label><input type="radio" name="submission_type" value="gap" /> Acuity discrepancy (pauses for charge nurse)</label>
    <label><input type="radio" name="submission_type" value="injection" /> Injection attempt</label>
  </fieldset>

  <button id="submit-btn" disabled>Submit</button>

  <div id="submit-result"></div>

  <script src="/static/channel.js"></script>
</body>
</html>
