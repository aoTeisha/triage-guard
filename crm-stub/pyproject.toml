[project]
name = "triage-guard-crm"
version = "1.0.0"
description = "Local SQLite CRM stub for Triage Guard — patient-history lookup behind the CRM contract."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

# A uv dependency group, not an extra: uv installs it on `uv sync` by default,
# so `uv run tests` works with no flags. Containers set UV_NO_DEV=1 to skip it.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
crm = "crm.api:run"
crm-seed = "crm.seed:main"
tests = "pytest:console_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
