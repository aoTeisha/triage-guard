[project]
name = "triage-guard"
version = "0.1.0"
description = "Triage Guard — AI-governed ER triage, as a LangGraph state machine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # error_handler= on add_node lands in 1.2; the AF-* degrade rows depend on it.
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.1",
    # OpenRouter is OpenAI-compatible; reached via ChatOpenAI(base_url=...).
    "langchain-openai>=0.2",
    "httpx>=0.27",
    "langfuse>=4.14.4",
    "python-dotenv>=1.2.3",
    "langchain>=1.4.0",
    # Symbolic governance layer for the monitor (docs/superpowers/specs/2026-09-19-monitor-symbolic-engines-design.md).
    "pyswip>=0.3.3",     # Prolog — needs SWI-Prolog (`swipl`) installed on the host
    "pyDatalog>=0.22",   # Datalog — pure Python
    "bppy>=1.0.4",       # Behavioral programming — pure Python
    # SMT solver for the design-time proofs (app/symbolic/z3_proofs.py). Arrives
    # anyway as a bppy dependency; declared because we import it ourselves.
    "z3-solver>=5.1",
]

[project.scripts]
triage-guard = "app.main:run"
kickoff = "app.main:kickoff"
plot = "app.main:plot"
visualize-graph = "app.visualize_graph:visualize"
sweeper = "app.monitor.sweeper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/monitor/schema.sql" = "app/monitor/schema.sql"

# A uv dependency group, not an extra: uv installs it on `uv sync` by default,
# so `uv run pytest` works with no flags. Matches crm-stub/ and intake-channel/.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: hits a real LLM or a running crm-stub; excluded from the fast suite",
]
