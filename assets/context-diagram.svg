<svg width="100%" viewBox="0 0 900 560" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>Triage Guard context diagram</title>
<desc>Components inside and outside the system boundary, with named arrows. The Acuity Classifier only proposes; the graph decides; OPA authorizes moves to treatment and releases, which staff start from the board. The patient identifier crosses the boundary only on the CRM arrows.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- outside the boundary -->
<rect x="200" y="20" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="280" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Intake nurse</text>
<text x="280" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">files the case</text>

<rect x="520" y="20" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="615" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Charge nurse / shift lead</text>
<text x="615" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">human authority</text>

<rect x="770" y="140" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="825" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">CRM</text>
<text x="825" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">patient history</text>

<!-- system boundary -->
<rect x="30" y="110" width="710" height="430" rx="20" fill="none" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="46" y="530" text-anchor="start" font-size="12" fill="#185FA5">System boundary · Triage Guard</text>

<!-- row 1 -->
<rect x="60" y="140" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="135" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Audit log</text>
<text x="135" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">append-only</text>

<rect x="300" y="140" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="385" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Board</text>
<text x="385" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">webform · queue · gate</text>

<!-- row 2 -->
<rect x="60" y="270" width="150" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="135" y="292" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Acuity classifier</text>
<text x="135" y="311" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">LLM · proposes only</text>

<rect x="300" y="270" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="385" y="292" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Graph</text>
<text x="385" y="311" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">decides · nodes write state</text>

<rect x="560" y="270" width="150" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="635" y="292" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">OPA</text>
<text x="635" y="311" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">privacy · move · release</text>

<!-- row 3 -->
<rect x="60" y="440" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="135" y="462" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Safety validation</text>
<text x="135" y="481" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Prolog + Datalog</text>

<rect x="300" y="440" width="170" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="385" y="462" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Human bridge</text>
<text x="385" y="481" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">gate pause</text>

<rect x="560" y="440" width="150" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="635" y="462" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Monitor</text>
<text x="635" y="481" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">sweeper · timers</text>

<!-- humans to the board -->
<line x1="295" y1="76" x2="345" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="292" y="96" text-anchor="end" font-size="12" fill="#5F5E5A">CASE_SUBMITTED</text>

<line x1="590" y1="78" x2="440" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="528" y="122" text-anchor="start" font-size="12" fill="#5F5E5A">gate answer · move · release</text>

<!-- board and graph -->
<line x1="370" y1="196" x2="370" y2="268" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="362" y="236" text-anchor="end" font-size="12" fill="#5F5E5A">start · resume</text>
<line x1="400" y1="270" x2="400" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="408" y="236" text-anchor="start" font-size="12" fill="#5F5E5A">CaseView</text>

<!-- graph and audit log -->
<line x1="300" y1="276" x2="212" y2="196" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="238" y="246" text-anchor="end" font-size="12" fill="#5F5E5A">AuditRecord</text>

<!-- graph and classifier -->
<line x1="300" y1="290" x2="212" y2="290" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="255" y="283" text-anchor="middle" font-size="11" fill="#5F5E5A">classify_request</text>
<line x1="210" y1="314" x2="298" y2="314" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="255" y="331" text-anchor="middle" font-size="11" fill="#5F5E5A">ActionProposal</text>

<!-- graph and OPA -->
<line x1="470" y1="290" x2="558" y2="290" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="515" y="283" text-anchor="middle" font-size="11" fill="#5F5E5A">PolicyQuery</text>
<line x1="560" y1="314" x2="472" y2="314" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="515" y="331" text-anchor="middle" font-size="11" fill="#5F5E5A">allow / deny</text>

<!-- graph and CRM: the only arrows that carry the patient identifier -->
<line x1="470" y1="276" x2="768" y2="172" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="222" text-anchor="middle" font-size="12" fill="#5F5E5A">HistoryLookup</text>
<line x1="770" y1="190" x2="530" y2="274" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="690" y="246" text-anchor="middle" font-size="12" fill="#5F5E5A">PatientHistory</text>

<!-- graph and safety validation -->
<line x1="315" y1="330" x2="172" y2="438" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="218" y="378" text-anchor="end" font-size="12" fill="#5F5E5A">ValidationRequest</text>
<line x1="195" y1="440" x2="336" y2="332" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="222" y="430" text-anchor="start" font-size="12" fill="#5F5E5A">SafetyVerdict</text>

<!-- graph and human bridge -->
<line x1="370" y1="330" x2="370" y2="438" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="362" y="395" text-anchor="end" font-size="12" fill="#5F5E5A">EscalationRequest</text>
<line x1="400" y1="440" x2="400" y2="332" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="408" y="395" text-anchor="start" font-size="12" fill="#5F5E5A">ApprovalToken</text>

<!-- monitor -->
<line x1="560" y1="450" x2="472" y2="332" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530" y="400" text-anchor="start" font-size="12" fill="#5F5E5A">TimerFired</text>
<line x1="700" y1="440" x2="822" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="770" y="340" text-anchor="start" font-size="12" fill="#5F5E5A">VisitWriteback</text>
</svg>
