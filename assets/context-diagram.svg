<svg width="100%" viewBox="0 0 680 720" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>Triage Guard context diagram</title>
<desc>Components inside and outside the system boundary, with named arrows. The Acuity Classifier only proposes; the Orchestrator decides; the Tool Gateway is the single execution point for the irreversible treatment-move.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="30" y="55" width="620" height="470" rx="20" fill="none" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="46" y="46" text-anchor="start" font-size="12" fill="#185FA5">System boundary — Triage Guard</text>

<rect x="60" y="80" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="135" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Intake nurse</text>
<text x="135" y="118" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">via webform</text>

<rect x="270" y="255" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="355" y="277" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Orchestrator</text>
<text x="355" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">decides · sole writer</text>

<rect x="60" y="255" width="150" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="135" y="277" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Acuity classifier</text>
<text x="135" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">proposes only</text>

<rect x="270" y="410" width="170" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="355" y="432" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Safety validation</text>
<text x="355" y="451" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">binding gate</text>

<rect x="500" y="410" width="130" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="565" y="432" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Human escal.</text>
<text x="565" y="451" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">bridge</text>

<rect x="500" y="255" width="130" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="565" y="277" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Tool gateway</text>
<text x="565" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">executes</text>

<rect x="270" y="145" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="355" y="167" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Audit store</text>

<rect x="475" y="80" width="175" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="562" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Charge nurse</text>
<text x="562" y="118" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">human authority</text>

<rect x="60" y="410" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="135" y="430" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">CRM</text>
<text x="135" y="448" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">patient history</text>

<rect x="475" y="560" width="175" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="562" y="580" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Downstream system</text>
<text x="562" y="598" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">starts treatment</text>

<line x1="160" y1="136" x2="300" y2="253" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="185" y="205" text-anchor="start" font-size="12" fill="#5F5E5A">CASE_SUBMITTED</text>

<line x1="270" y1="278" x2="212" y2="278" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="241" y="248" text-anchor="middle" font-size="12" fill="#5F5E5A">classify_req</text>
<line x1="210" y1="298" x2="268" y2="298" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="241" y="335" text-anchor="middle" font-size="12" fill="#5F5E5A">ActionProposal</text>

<line x1="339" y1="410" x2="339" y2="317" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250" y="365" text-anchor="start" font-size="12" fill="#5F5E5A">ValidationRequest</text>
<line x1="371" y1="315" x2="371" y2="408" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="375" y="365" text-anchor="start" font-size="12" fill="#5F5E5A">SafetyVerdict</text>

<line x1="440" y1="430" x2="498" y2="430" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="469" y="404" text-anchor="middle" font-size="12" fill="#5F5E5A">Escalation</text>
<line x1="498" y1="452" x2="440" y2="452" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="469" y="480" text-anchor="middle" font-size="12" fill="#5F5E5A">ApprovalToken</text>

<line x1="546" y1="410" x2="546" y2="317" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="546" y1="136" x2="549" y2="223" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="581" y1="223" x2="578" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="588" y="180" text-anchor="start" font-size="12" fill="#5F5E5A">asks / answers</text>

<line x1="440" y1="285" x2="498" y2="285" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="469" y="245" text-anchor="middle" font-size="12" fill="#5F5E5A">Action</text>
<text x="469" y="330" text-anchor="middle" font-size="12" fill="#5F5E5A">Request</text>

<line x1="355" y1="255" x2="355" y2="191" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="375" y="225" text-anchor="start" font-size="12" fill="#5F5E5A">AuditRecord</text>

<line x1="270" y1="432" x2="212" y2="432" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="241" y="410" text-anchor="middle" font-size="12" fill="#5F5E5A">Lookup</text>
<line x1="210" y1="452" x2="268" y2="452" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="241" y="478" text-anchor="middle" font-size="12" fill="#5F5E5A">History</text>

<line x1="549" y1="470" x2="549" y2="558" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="515" text-anchor="start" font-size="12" fill="#5F5E5A">move_to_treatment</text>
<line x1="581" y1="558" x2="581" y2="472" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text x="588" y="515" text-anchor="start" font-size="12" fill="#5F5E5A">ToolReceipt?</text>
</svg>