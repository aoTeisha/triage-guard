[project]
name = "triage-guard"
version = "0.1.0"
description = "Triage Guard — AI-governed ER triage crew"
requires-python = ">=3.12"
dependencies = [
    "crewai[tools]>=1.15.16",
    "langfuse>=4.14.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
triage-guard = "app.main:run"
run_crew = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.crewai]
type = "crew"
