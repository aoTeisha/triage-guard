[project]
name = "triage-guard"
version = "0.1.0"
description = "Triage Guard — AI-governed ER triage crew"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai[tools]>=1.15.16",
    "httpx>=0.27",
    "langfuse>=4.14.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
triage-guard = "app.main:run"
run_crew = "app.main:run"
tests = "pytest:console_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.crewai]
type = "crew"

# A uv dependency group, not an extra: uv installs it on `uv sync` by default,
# so `uv run tests` works with no flags. Matches crm-stub/ and intake-channel/.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: hits a real LLM or a running crm-stub; excluded from the fast suite",
]
